name: BrandFlow CI

on:
  pull_request:
  push:
    branches:
      - main
      - "chatgpt/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply dependency security fixes on validation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/autopublish-ci' && !contains(github.event.head_commit.message, '[audit-fixed]')
        run: |
          npm audit fix --force
          git config user.name "BrandFlow CI"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply npm audit fixes [audit-fixed]"
            git push
          fi
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
